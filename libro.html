<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Libro – Librarium.es</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/estilos.css">
  <meta name="description" content="Ficha completa del libro con valoración, resumen y detalles.">
</head>

<body>

<header class="header">
  <div class="container header-flex">

    <div class="logo-box">
      <span class="logo-icon">📚</span>
      <span class="logo-text">Librarium.es</span>
    </div>

    <nav class="menu">
      <a href="index.html">Inicio</a>
      <a href="blog.html">Blog</a>
      <a href="libros.html">Libros</a>
      <a href="rankings.html">Rankings</a>
      <a href="resenas.html">Reseñas</a>
      <a href="contacto.html">Contacto</a>
    </nav>

    <div class="search-box">
      <form action="buscar.html" method="GET">
        <input type="text" name="q" placeholder="Buscar libros..." required>
        <button type="submit">🔍</button>
      </form>
    </div>

  </div>
</header>

<section class="hero" style="background-image:url('img/hero.png');">
  <div class="container" style="background:rgba(0,0,0,0.55);padding:50px 30px;border-radius:12px;">
    <h2 id="tituloHero" style="color:#fff;font-size:2.2rem;">Cargando...</h2>
  </div>
</section>

<main class="container">
  <section class="section" id="contenidoLibro">
    <p>Cargando datos...</p>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <p>© 2025 Librarium.es – Todos los derechos reservados</p>
    <div class="footer-links">
      <a href="quienes-somos.html">Quiénes somos</a>
      <a href="privacidad.html">Política de privacidad</a>
      <a href="cookies.html">Política de cookies</a>
      <a href="aviso-legal.html">Aviso legal</a>
    </div>
  </div>
</footer>

<script>
const AFFILIATE_TAG = "librarium01-21";
let asinData = {};

function generarEstrellas(rating) {
  const r = Number(rating) || 0;
  return "⭐".repeat(Math.round(r)) + ` (${r}/5)`;
}

function ratingAlternativo(titulo) {
  let seed = 0;
  for (let i = 0; i < titulo.length; i++) seed += titulo.charCodeAt(i);
  return (3.5 + (seed % 13) / 10).toFixed(1);
}

/* ✅ FUNCIÓN DE PORTADA DEFINITIVA */
function portadaLibro(info) {
  if (info.industryIdentifiers) {
    const isbn = info.industryIdentifiers.find(i =>
      i.type === "ISBN_13" || i.type === "ISBN_10"
    );
    if (isbn) {
      return `https://covers.openlibrary.org/b/isbn/${isbn.identifier}-L.jpg`;
    }
  }

  if (info.imageLinks?.thumbnail) {
    return info.imageLinks.thumbnail.replace(/^http:\/\//i, "https://");
  }

  return "img/portada-default.png";
}

async function cargarAsinData() {
  try {
    const res = await fetch("asin.json");
    asinData = await res.json();
  } catch {
    asinData = {};
  }
}

function generarEnlaceAmazon(titulo, autor) {
  if (asinData[titulo]) {
    return `https://www.amazon.es/dp/${asinData[titulo]}?tag=${AFFILIATE_TAG}`;
  }
  const q = encodeURIComponent(`${titulo} ${autor}`);
  return `https://www.amazon.es/s?k=${q}&tag=${AFFILIATE_TAG}`;
}

async function cargarLibro() {
  await cargarAsinData();

  const id = new URLSearchParams(location.search).get("id");
  if (!id) {
    document.getElementById("contenidoLibro").innerHTML = "<p>Libro no encontrado.</p>";
    return;
  }

  const res = await fetch(`https://www.googleapis.com/books/v1/volumes/${id}`);
  const data = await res.json();
  const info = data.volumeInfo || {};

  const titulo = info.title || "Título no disponible";
  const autor = info.authors?.join(", ") || "Autor desconocido";
  const descripcion = info.description || "Sin descripción disponible.";
  const rating = info.averageRating || ratingAlternativo(titulo);

  document.getElementById("tituloHero").textContent = titulo;

  document.getElementById("contenidoLibro").innerHTML = `
    <div class="card" style="max-width:720px;margin:auto;display:flex;gap:20px;flex-wrap:wrap;">
      <div style="flex:0 0 200px;">
        <img 
          src="${portadaLibro(info)}"
          alt="Portada del libro"
          style="width:100%;border-radius:8px;"
          onerror="this.onerror=null;this.src='img/portada-default.png';">
      </div>
      <div style="flex:1;min-width:260px;">
        <h3>${titulo}</h3>
        <p><strong>${autor}</strong></p>
        <p>${generarEstrellas(rating)}</p>

        <a class="btn-secondary"
           href="${generarEnlaceAmazon(titulo, autor)}"
           target="_blank" rel="noopener noreferrer"
           style="display:inline-block;margin:10px 0;padding:12px 20px;background:#ff9900;color:#111;border-radius:6px;font-weight:bold;text-decoration:none;">
           🛒 Ver precio en Amazon
        </a>

        <p style="margin-top:15px;line-height:1.6;">${descripcion}</p>
      </div>
    </div>
  `;
}

cargarLibro();
</script>

</body>
</html>
